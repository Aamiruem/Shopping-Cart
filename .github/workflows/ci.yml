# Runs on every push and pull request: backend lint + tests (against real PostgreSQL and MongoDB),
# AI service tests, frontend build and an AWS template check.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U shop" --health-interval 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt ruff==0.8.4
      - run: ruff check app scripts tests && ruff format --check app scripts tests
      - name: Tests (ML unit tests + API tests against the service databases)
        env:
          TEST_DATABASE_URL: postgres://shop:shop@localhost:5432/shop_test
          TEST_MONGO_URI: mongodb://localhost:27017/shop_test
        run: |
          python -m scripts.seed --customers 120 --days 120
          pytest -q

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ai-service }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai-service/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install cfn-lint
      - run: cfn-lint infra/aws/cloudformation.yml
      - run: bash -n infra/aws/deploy.sh && bash -n infra/aws/seed.sh
