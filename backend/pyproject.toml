[project]
name = "veyra-api"
version = "2.0.0"
description = "Veyra marketplace API: FastAPI + PostgreSQL + MongoDB, with analytics and ML"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends(...) in defaults is idiomatic

[tool.ruff.format]
quote-style = "double"
