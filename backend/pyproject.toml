[project]
name = "arvixa-api"
version = "2.0.0"
description = "Arvixa marketplace API: FastAPI + PostgreSQL + MongoDB, with analytics and ML"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends(...) in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# main.py makes `python main.py` work (picks the right .venv, sets the package) before its imports can run
"app/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
