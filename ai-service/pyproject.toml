[project]
name = "arvixa-ai-service"
version = "2.0.0"
description = "Arvixa AI service: RAG, agents, ML, deep learning, statistics and data visualisation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # the dev JWT secret is short; production must set a long JWT_SECRET (the backend refuses to start otherwise)
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends(...) in defaults is idiomatic

[tool.ruff.format]
quote-style = "double"
