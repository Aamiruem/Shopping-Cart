server {
  listen 80;
  root /usr/share/nginx/html;

  # API (and locally stored product images) go to the FastAPI backend
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;  # product uploads: images 5 MB, audio 10 MB, videos 50 MB
    proxy_read_timeout 120s;  # first analytics request trains the ML models
  }

  # SEO files are generated by the API from the live catalog
  location = /sitemap.xml { proxy_pass http://backend:5000; }
  location = /robots.txt  { proxy_pass http://backend:5000; }

  # Catalog images shipped with the store
  location /catalog/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other route serves index.html
  location / {
    try_files $uri /index.html;
  }
}
