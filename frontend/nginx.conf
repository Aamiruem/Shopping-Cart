server {
  listen 80;
  root /usr/share/nginx/html;

  # API (and locally stored product images) go to the FastAPI backend
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;  # product image uploads are up to 5 MB
    proxy_read_timeout 120s;  # first analytics request trains the ML models
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other route serves index.html
  location / {
    try_files $uri /index.html;
  }
}
