server {
  listen 80;
  root /usr/share/nginx/html;

  # API (and locally stored product images) go to the FastAPI backend
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m;  # product uploads: images 5 MB, audio 10 MB, videos 50 MB
    proxy_read_timeout 120s;  # first analytics request trains the ML models
  }

  # Bulk product upload: a CSV + a ZIP of photos / videos (up to 1 GB), streamed straight to the API
  location /api/seller/imports {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1100m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }

  # SEO files are generated by the API from the live catalog
  location = /sitemap.xml { proxy_pass http://backend:5000; }
  location = /robots.txt  { proxy_pass http://backend:5000; }

  # Catalog images shipped with the store
  location /catalog/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Product and category pages: the API returns index.html with that page's title, description, link-preview
  # card, schema.org data and a plain-HTML copy of the content (for Bing and WhatsApp / Facebook / X previews,
  # which don't run JavaScript). If the API errors or is down, the plain single-page app is served instead.
  location ~ ^/products(/|$) {
    rewrite ^ /api/seo/page break;
    proxy_pass http://backend:5000;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;
  }

  location @spa {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # The app shell must never be cached, so a new deploy is picked up straight away
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: every other route serves index.html
  location / {
    try_files $uri /index.html;
  }
}
