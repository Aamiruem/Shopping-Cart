AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Veyra marketplace - FastAPI backend + AI service on ECS Fargate behind an ALB, PostgreSQL on RDS,
  product images in S3, React frontend in S3, everything served through one CloudFront domain.
  MongoDB is external (MongoDB Atlas on AWS or Amazon DocumentDB) and passed in as a connection string.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]+"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into (the default VPC is fine for a first deployment)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different availability zones (public subnets, so tasks can pull images without a NAT gateway)
  MongoUri:
    Type: String
    NoEcho: true
    Description: MongoDB connection string, e.g. mongodb+srv://user:pass@cluster.mongodb.net/veyra (Atlas) or a DocumentDB URI
  BackendImage:
    Type: String
    Description: Full image URI pushed by deploy.sh, e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com/veyra-backend:abc123
  AiServiceImage:
    Type: String
    Description: Full image URI of the AI service
  GoogleClientId:
    Type: String
    Default: ""
    Description: Optional - OAuth client ID for "Continue with Google"
  AnthropicApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional - enables the AI shopping assistant and RAG answers
  SmtpHost:
    Type: String
    Default: ""
    Description: Optional - e.g. email-smtp.ap-south-1.amazonaws.com (Amazon SES). Empty = OTP codes are only logged.
  SmtpUser:
    Type: String
    Default: ""
  SmtpPass:
    Type: String
    Default: ""
    NoEcho: true
  RazorpayKeyId:
    Type: String
    Default: ""
    Description: Razorpay key id (rzp_live_... or rzp_test_...); empty = cash on delivery only
  RazorpayKeySecret:
    Type: String
    Default: ""
    NoEcho: true
  RazorpayWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
  MailFrom:
    Type: String
    Default: "Veyra <no-reply@example.com>"
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10

Resources:
  # ---------------------------------------------------------------- Secrets
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub veyra/${Environment}/jwt-secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub veyra/${Environment}/postgres
      GenerateSecretString:
        SecretStringTemplate: '{"username": "veyra"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\' "

  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub veyra/${Environment}/app
      SecretString: !Sub '{"MONGO_URI": "${MongoUri}", "ANTHROPIC_API_KEY": "${AnthropicApiKey}", "SMTP_PASS": "${SmtpPass}", "RAZORPAY_KEY_SECRET": "${RazorpayKeySecret}", "RAZORPAY_WEBHOOK_SECRET": "${RazorpayWebhookSecret}"}'

  # ---------------------------------------------------------------- Networking
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP to the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks - reachable only from the ALB and each other
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5000, ToPort: 5000, SourceSecurityGroupId: !Ref AlbSecurityGroup }

  ServiceSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 8000
      SourceSecurityGroupId: !Ref ServiceSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL - reachable only from the ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ServiceSecurityGroup }

  # ---------------------------------------------------------------- PostgreSQL (RDS)
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Veyra database subnets
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "17.11"  # bump when AWS deprecates it (cfn-lint warns W3691)
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: veyra
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      EnablePerformanceInsights: false

  # ---------------------------------------------------------------- Storage
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Both buckets stay private; only CloudFront (via Origin Access Control) can read them
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub veyra-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub veyra-${Environment}
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
      ServiceConnectDefaults:
        Namespace: !Sub veyra-${Environment}.local

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/veyra-${Environment}
      RetentionInDays: 30

  # Used by ECS itself: pull images, write logs, read secrets
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"]
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref JwtSecret, !Ref DbSecret, !Ref AppSecrets]

  # Used by the backend code: upload product images to S3
  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: media-uploads
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${MediaBucket.Arn}/media/*

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub veyra-${Environment}-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings: [{ Name: backend, ContainerPort: 5000, AppProtocol: http }]
          Environment:
            - { Name: APP_ENV, Value: production }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_NAME, Value: veyra }
            - { Name: DB_USER, Value: veyra }
            - { Name: AI_SERVICE_URL, Value: "http://ai-service:8000" }
            - { Name: CORS_ORIGIN, Value: !Sub "https://${Distribution.DomainName}" }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: S3_BUCKET, Value: !Ref MediaBucket }
            - { Name: S3_PUBLIC_URL, Value: !Sub "https://${Distribution.DomainName}" }
            - { Name: GOOGLE_CLIENT_ID, Value: !Ref GoogleClientId }
            - { Name: SMTP_HOST, Value: !Ref SmtpHost }
            - { Name: SMTP_USER, Value: !Ref SmtpUser }
            - { Name: MAIL_FROM, Value: !Ref MailFrom }
            - { Name: RAZORPAY_KEY_ID, Value: !Ref RazorpayKeyId }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${DbSecret}:password::" }
            - { Name: JWT_SECRET, ValueFrom: !Ref JwtSecret }
            - { Name: MONGO_URI, ValueFrom: !Sub "${AppSecrets}:MONGO_URI::" }
            - { Name: SMTP_PASS, ValueFrom: !Sub "${AppSecrets}:SMTP_PASS::" }
            - { Name: RAZORPAY_KEY_SECRET, ValueFrom: !Sub "${AppSecrets}:RAZORPAY_KEY_SECRET::" }
            - { Name: RAZORPAY_WEBHOOK_SECRET, ValueFrom: !Sub "${AppSecrets}:RAZORPAY_WEBHOOK_SECRET::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  AiServiceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub veyra-${Environment}-ai-service
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: ai-service
          Image: !Ref AiServiceImage
          Essential: true
          PortMappings: [{ Name: ai-service, ContainerPort: 8000, AppProtocol: http }]
          Environment:
            - { Name: BACKEND_URL, Value: "http://backend:5000" }
          Secrets:
            - { Name: ANTHROPIC_API_KEY, ValueFrom: !Sub "${AppSecrets}:ANTHROPIC_API_KEY::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ai-service

  # ECS Service Connect gives each service a stable name (backend, ai-service) inside the cluster
  BackendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref Cluster
      ServiceName: backend
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref BackendTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - { ContainerName: backend, ContainerPort: 5000, TargetGroupArn: !Ref BackendTargetGroup }
      ServiceConnectConfiguration:
        Enabled: true
        Services:
          - PortName: backend
            ClientAliases: [{ DnsName: backend, Port: 5000 }]

  AiService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      ServiceName: ai-service
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref AiServiceTaskDefinition
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      ServiceConnectConfiguration:
        Enabled: true
        Services:
          - PortName: ai-service
            ClientAliases: [{ DnsName: ai-service, Port: 8000 }]

  BackendScaling:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${BackendService.Name}
      MinCapacity: !Ref DesiredCount
      MaxCapacity: 6

  BackendCpuPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: backend-cpu-60
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScaling
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

  # ---------------------------------------------------------------- Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }  # first analytics request trains ML models

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 5000
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "20" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref BackendTargetGroup }]

  # ---------------------------------------------------------------- CloudFront (one HTTPS domain for everything)
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Veyra ${Environment}
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          - PathPattern: /media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # Single-page app: unknown paths serve index.html so client-side routes work on refresh
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

Outputs:
  SiteUrl:
    Description: Open the store here
    Value: !Sub https://${Distribution.DomainName}
  DistributionId:
    Value: !Ref Distribution
  FrontendBucketName:
    Description: Upload frontend/dist here (aws s3 sync)
    Value: !Ref FrontendBucket
  MediaBucketName:
    Value: !Ref MediaBucket
  ClusterName:
    Value: !Ref Cluster
  SeedTaskSubnets:
    Description: Subnets and security group for the one-off seed task (see infra/aws/README.md)
    Value: !Join [",", !Ref SubnetIds]
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
  BackendTaskDefinitionArn:
    Value: !Ref BackendTaskDefinition
